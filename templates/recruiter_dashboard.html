<!DOCTYPE html>
<html>

<head>

    <title>Recruiter Dashboard</title>

    <style>

        body{
            font-family:Arial;
            background:#f1f5f9;
            margin:0;
            padding:0;
        }

        .navbar{
            background:#1e293b;
            color:white;
            padding:20px;
            display:flex;
            align-items:center;
            gap:15px;
        }

        .navbar h1{
            margin-right:auto;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            background:#2563eb;
            padding:10px 15px;
            border-radius:5px;
        }

        .navbar a:hover{
            background:#1d4ed8;
        }

        .container{
            width:80%;
            margin:auto;
            margin-top:30px;
        }

        .job-box{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        .btn{
            text-decoration:none;
            padding:10px 15px;
            border-radius:5px;
            color:white;
            display:inline-block;
            margin-top:10px;
            margin-right:10px;
        }

        .edit-btn{
            background:green;
        }

        .delete-btn{
            background:red;
        }

        .edit-btn:hover{
            background:#166534;
        }

        .delete-btn:hover{
            background:#b91c1c;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h1>Recruiter Dashboard</h1>

    <a href="{% url 'home' %}">Home</a>

    <a href="{% url 'add_job' %}">Add New Job</a>

    <a href="{% url 'logout' %}">Logout</a>

</div>

<div class="container">

    <h2>Your Posted Jobs</h2>

    {% for job in jobs %}

    <div class="job-box">

        <h2>{{job.title}}</h2>

        <p><b>Company:</b> {{job.company}}</p>

        <p><b>Location:</b> {{job.location}}</p>

        <p><b>Skills:</b> {{job.skills}}</p>

        <p><b>Salary:</b> ₹ {{job.salary}}</p>

        <!-- FIXED EDIT LINK -->
        <a href="{% url 'edit_job' job.id %}" class="btn edit-btn">
            Edit
        </a>

        <!-- DELETE -->
        <a href="{% url 'delete_job' job.id %}"
           class="btn delete-btn"
           onclick="return confirm('Are you sure to delete this job?')">
            Delete
        </a>

    </div>

    {% empty %}

    <div class="job-box">
        <h3>No Jobs Posted</h3>
    </div>

    {% endfor %}

</div>

</body>
</html>
