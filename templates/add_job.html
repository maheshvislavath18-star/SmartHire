<!DOCTYPE html>
<html>
<head>

    <title>Add Job</title>

    <style>

        body{
            font-family:Arial;
            background:#f1f5f9;
        }

        .box{
            width:600px;
            margin:auto;
            margin-top:40px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input,textarea{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Add New Job</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Post Job
            </button>

        </form>

    </div>

</body>
</html>
