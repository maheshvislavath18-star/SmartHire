<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <style>

        body{
            font-family:Arial;
            background:#e2e8f0;
        }

        .form-box{
            width:400px;
            background:white;
            margin:auto;
            margin-top:80px;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input, select{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        h1{
            text-align:center;
        }

    </style>

</head>

<body>

<div class="form-box">

    <h1>User Registration</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>
</html>
