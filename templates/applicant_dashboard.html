<!DOCTYPE html>
<html>
<head>
    <title>Applicant Dashboard</title>

    <style>
        body{
            font-family: Arial;
            background: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        .navbar{
            background: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container{
            width: 80%;
            margin: auto;
            margin-top: 30px;
        }

        .card{
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ddd;
            transition: 0.3s;
        }

        .card:hover{
            transform: scale(1.02);
        }

        .job-title{
            font-size: 18px;
            font-weight: bold;
            color: #0f172a;
        }

        .company{
            color: #475569;
            margin-top: 5px;
        }

        .empty{
            text-align: center;
            margin-top: 50px;
            color: gray;
        }

        .badge{
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            font-weight: bold;
        }

        .Pending{
            background: #facc15;
            color: black;
        }

        .Accepted{
            background: #22c55e;
            color: white;
        }

        .Rejected{
            background: #ef4444;
            color: white;
        }

    </style>
</head>

<body>

<div class="navbar">
    <h1>Applicant Dashboard</h1>
</div>

<div class="container">

    <h2>Applied Jobs</h2>

    {% for app in applications %}

    <div class="card">

        <!-- JOB TITLE -->
        <div class="job-title">
            {{ app.job.title }}
        </div>

        <!-- COMPANY -->
        <div class="company">
            {{ app.job.company }}
        </div>

        <!-- STATUS -->
        <div>
            <span class="badge {{ app.status }}">
                {{ app.status }}
            </span>
        </div>

    </div>

    {% empty %}

    <div class="empty">
        <h3>No Applications Yet</h3>
        <p>Start applying for jobs 🚀</p>
    </div>

    {% endfor %}

</div>

</body>
</html>
