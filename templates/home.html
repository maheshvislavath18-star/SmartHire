{% extends 'base.html' %}

{% block content %}

<style>

    body{
        font-family: Arial;
        background: #f1f5f9;
    }

    h1{
        text-align: center;
        margin-top: 20px;
        color: #0f172a;
    }

    /* 🔍 SEARCH BAR */
    .search-box{
        text-align: center;
        margin: 20px;
    }

    .search-box input{
        padding: 10px;
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    .search-box button{
        padding: 10px 15px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .container{
        width: 80%;
        margin: auto;
    }

    /* JOB CARD */
    .card{
        background: white;
        padding: 20px;
        margin: 15px 0;
        border-radius: 10px;
        box-shadow: 0px 0px 10px #ddd;
    }

    .card h2{
        color: #1e293b;
    }

    .btn{
        display: inline-block;
        padding: 10px 15px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        margin-top: 10px;
    }

    .btn:hover{
        background: #1d4ed8;
    }

    .meta{
        color: #475569;
        margin: 5px 0;
    }

</style>

<h1>Latest Jobs</h1>

<!-- 🔍 SEARCH BAR -->
<div class="search-box">

    <form method="GET">

        <input type="text" 
               name="q" 
               placeholder="Search jobs (Python, Django, Company...)"
               value="{{ request.GET.q }}">

        <button type="submit">Search</button>

    </form>

</div>

<div class="container">

    {% for job in jobs %}

    <div class="card">

        <h2>{{ job.title }}</h2>

        <div class="meta"><b>Company:</b> {{ job.company }}</div>
        <div class="meta"><b>Location:</b> {{ job.location }}</div>
        <div class="meta"><b>Salary:</b> ₹{{ job.salary }}</div>
        <div class="meta"><b>Skills:</b> {{ job.skills }}</div>

        <a href="{% url 'apply_job' job.id %}" class="btn">
            Apply Now
        </a>

    </div>

    {% empty %}

    <div class="card">
        <h3>No Jobs Available</h3>
    </div>

    {% endfor %}

</div>

{% endblock %}
