{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHire</title>

    <!-- 🔥 GLOBAL CSS -->
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f1f5f9;
        }

        /* NAVBAR */
        .navbar{
            background:#0f172a;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
        }

        .logo{
            color:white;
            font-size:26px;
            font-weight:bold;
        }

        .nav-links{
            display:flex;
            align-items:center;
            flex-wrap:wrap;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            margin-left:12px;
            padding:10px 15px;
            border-radius:8px;
            background:#2563eb;
            transition:0.3s;
            font-size:14px;
        }

        .nav-links a:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        /* MAIN CONTAINER */
        .container{
            width:85%;
            margin:auto;
            margin-top:30px;
            margin-bottom:40px;
        }

        /* CARDS */
        .card{
            background:white;
            padding:25px;
            border-radius:14px;
            box-shadow:0px 4px 15px rgba(0,0,0,0.08);
            margin-bottom:20px;
        }

        /* BUTTONS */
        .btn{
            display:inline-block;
            padding:10px 16px;
            border-radius:8px;
            text-decoration:none;
            color:white;
            border:none;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .blue{
            background:#2563eb;
        }

        .green{
            background:#16a34a;
        }

        .red{
            background:#dc2626;
        }

        .yellow{
            background:#ca8a04;
        }

        /* MOBILE RESPONSIVE */
        @media(max-width:768px){

            .navbar{
                flex-direction:column;
                align-items:flex-start;
            }

            .nav-links{
                margin-top:15px;
            }

            .nav-links a{
                margin:5px 5px 0px 0px;
            }

            .container{
                width:95%;
            }

        }

    </style>

</head>

<body>

    <!-- 🔥 NAVBAR -->
    <div class="navbar">

        <div class="logo">
            SmartHire
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">Home</a>

            {% if request.user.is_authenticated %}

                <a href="{% url 'dashboard' %}">
                    Dashboard
                </a>

                <a href="{% url 'add_job' %}">
                    Add Job
                </a>

                <a href="{% url 'resume_list' %}">
                    Resumes
                </a>

                <a href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

    <!-- 🔥 PAGE CONTENT -->
    <div class="container">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
